<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청 확인 - 요양보호사 보수교육</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=2611241425">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>신청확인</h1>
  </div>
</header>
<main class="wrap">
<form id="f" class="card" novalidate>
  <h2>신청 내역 조회</h2>
  <p class="note" style="margin-top:-4px;margin-bottom:14px">신청하실 때 입력한 이름과 생년월일로 조회합니다. 단체 신청은 수강생 본인의 이름으로 조회하세요.</p>
  <div class="field">
    <label for="name">이름</label>
    <input type="text" id="name" autocomplete="name" placeholder="홍길동">
  </div>
  <div class="field">
    <label for="birth">생년월일 <span class="hint">숫자 6자리 (예: 640512)</span></label>
    <input type="tel" id="birth" inputmode="numeric" maxlength="6" placeholder="640512">
  </div>
  <div class="err" id="formErr" style="margin-bottom:10px"></div>
  <button class="btn big" type="submit" id="findBtn">조회</button>
</form>

<div id="result" style="margin-top:18px"></div>

<div class="box warn" style="margin-top:18px">
  <b>교육 취소·차수 변경은 홈페이지에서 할 수 없습니다.</b><br>
  교육원으로 전화 주시면 확인 후 처리해 드립니다.<br>
  전화 <a id="telLink" href="#"><span data-site="phone"></span></a> · <span data-site="hours"></span>
</div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var S = window.SITE;
  var $ = function (id) { return document.getElementById(id); };
  var tel = String(S.phone || '').replace(/[^\d]/g, '');
  if (tel) $('telLink').href = 'tel:' + tel;

  $('birth').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });

  // 진행상태 -> 화면 표시 단계
  var PAID = ['입금확인', '확정', '수료'];
  function stepHtml(cls, title, sub) {
    return '<li class="' + cls + '"><b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</li>';
  }
  function card(it, name, birth) {
    var steps = '';
    var cancelled = it.status === '취소' || it.status === '환불완료';
    steps += stepHtml('done', '신청완료', BOSU.esc(it.appliedAt) + ' 접수');
    if (cancelled) {
      steps += stepHtml('cancel', it.status === '환불완료' ? '수강취소 및 환불완료' : '수강취소 (환불 처리 중)', '');
    } else if (PAID.indexOf(it.status) >= 0) {
      var amt = it.paidAmount ? Number(it.paidAmount).toLocaleString('ko-KR') + '원' : '';
      steps += stepHtml('done', '교육비 납부완료', [it.paidAt ? BOSU.esc(it.paidAt) + ' 입금 확인' : '', amt].filter(Boolean).join(' · '));
      if (it.status === '수료') steps += stepHtml('done', '교육 수료', it.certNo ? '이수증 제 ' + BOSU.esc(it.certNo) + ' 호' : '');
    } else {
      var payer = it.type === '단체' ? '센터명' : BOSU.esc(name + birth.slice(2));
      steps += stepHtml('wait', '교육비 납부 대기',
        BOSU.esc(S.bank) + ' ' + BOSU.esc(S.account) + ' (예금주 ' + BOSU.esc(S.accountHolder) + ')<br>' +
        '교육비 ' + BOSU.esc(S.fee) + '원 · 입금자명 ' + payer);
    }
    return '<section class="card result' + (cancelled ? ' is-cancel' : '') + '">' +
      '<div class="r-head"><div><b>' + BOSU.esc(it.courseName) + '</b> ' + BOSU.krDate(it.date) + '</div>' +
      '<div class="note">' + [BOSU.esc(it.time), BOSU.esc(it.place)].filter(Boolean).join(' · ') + '</div>' +
      '<div class="note">신청번호 ' + BOSU.esc(it.applyNo) + ' · ' + BOSU.esc(it.type) + ' 신청</div></div>' +
      '<ul class="steps">' + steps + '</ul></section>';
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var fe = $('formErr'); fe.classList.remove('on');
    var name = $('name').value.trim(), birth = $('birth').value;
    var msg = !name ? '이름을 입력해 주세요.' : BOSU.birthError(birth);
    if (msg) { fe.textContent = msg; fe.classList.add('on'); return; }
    var btn = $('findBtn'); btn.disabled = true; btn.textContent = '조회 중...';
    BOSU.submit({ action: 'lookup', name: name, birth: birth }).then(function (r) {
      if (!r.ok) throw new Error(r.message || '조회하지 못했습니다.');
      var box = $('result');
      if (!r.items.length) {
        box.innerHTML = '<div class="card">조회된 신청 내역이 없습니다.<br><span class="note">이름과 생년월일을 다시 확인해 주세요. 그래도 없으면 교육원으로 전화해 주세요.</span></div>';
      } else {
        box.innerHTML = '<h2>' + BOSU.esc(name) + '님의 신청 내역 (' + r.items.length + '건)</h2>' +
          r.items.map(function (it) { return card(it, name, birth); }).join('');
      }
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function (err) {
      fe.textContent = err.message; fe.classList.add('on');
    }).then(function () { btn.disabled = false; btn.textContent = '조회'; });
  });
});
</script>
<footer><span data-site="name"></span> · <span data-site="phone"></span></footer>
<script src="assets/config.js?v=2611241425"></script>
<script src="assets/common.js?v=2611241425"></script>
</body>
</html>
